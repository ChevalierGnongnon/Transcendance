server {
    listen 80;
    server_name transcendance.fr www.transcendance.fr;

    return 301 https://$host$request_uri;
}

server  {
    listen 				443 ssl default_server;
    listen 				[::]:443 ssl default_server;
	server_name 		transcendance.fr www.transcendance.fr;

    ssl_protocols 		TLSv1.2 TLSv1.3;
    ssl_certificate_key /run/secrets/ssl_private_key;
    ssl_certificate 	/run/secrets/ssl_certificate;

    proxy_set_header	Host $host;
    proxy_set_header	X-Real-IP $remote_addr;
    add_header 			Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header			X-Content-Type-Options "nosniff" always;
    add_header			X-Frame-Options "DENY" always;
    add_header			Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404-page-not-found.html;

    location /api/ {
        client_max_body_size 6M;
        proxy_pass http://backend:3000;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /404-page-not-found.html {
        root /usr/share/nginx/html;
        internal;
    }
}
